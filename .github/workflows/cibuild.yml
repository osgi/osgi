name: CI Build

on:
  push:
    branches-ignore:
    - 'dependabot/**'
    # TEMPORARY (throwaway test commit — revert before merge): the Central publishing test
    # runs from central-publish-test.yml and needs neither the full workspace build nor the
    # specification and TCK jobs.
    - 'build_sta'
    paths:
    - '**'
    - '!.design/**'
    - '!*.md'
    - '!.github/**'
    - '.github/**/*ci*'
  pull_request:
    paths:
    - '**'
    - '!.design/**'
    - '!*.md'
    - '!.github/**'
    - '.github/**/*ci*'

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true
    -Dmaven.repo.local=cnf/generated/m2
  canonical: ${{ (github.repository == 'osgi/osgi') && ((github.ref == 'refs/heads/main') || (github.ref == 'refs/heads/release')) && (github.event_name != 'pull_request') }}
  java_version: 17

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Artifacts
    runs-on: ubuntu-latest
    outputs:
      tck-matrix: ${{ steps.publish-tck-matrix.outputs.tck-matrix }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Git Unshallow
      if: ${{ fromJSON(env.canonical) }}
      run: |
        git fetch --prune --unshallow
        git describe --dirty --always --abbrev=9
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.java_version }}
    - name: Build
      id: build
      uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        arguments: --continue :buildscriptDependencies :build
    - name: Publish TCK Matrix Output
      id: publish-tck-matrix
      run: |
        cat $GITHUB_WORKSPACE/matrix.json
        tck_matrix=$(cat $GITHUB_WORKSPACE/matrix.json)
        echo "tck-matrix=${tck_matrix}" >> $GITHUB_OUTPUT
    - name: Upload TCK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: OSGi-TCK
        if-no-files-found: error
        path: |
          osgi.tck/generated/osgi.tck.*/
          !osgi.tck/generated/osgi.tck.*.jar
    # A snapshot build is fully published by :publish below — it deploys straight to the
    # Central snapshot repository. Only a release build needs the bundle upload afterwards.
    #
    # Release or snapshot is decided by -snapshot: in cnf/build.bnd, not by the branch:
    # commented out means SNAPSHOT versions. Gating on the branch would try to upload
    # SNAPSHOT artifacts to the release endpoint whenever the release branch has not had
    # -snapshot: enabled. (Same detection as bnd's ci-publish.sh.)
    - name: Detect build type
      id: buildtype
      if: ${{ fromJSON(env.canonical) }}
      run: |
        if grep -qE '^-snapshot:' cnf/build.bnd; then
          echo "Release build (-snapshot: is set in cnf/build.bnd)"
          echo "release=true" >> "${GITHUB_OUTPUT}"
        else
          echo "Snapshot build (-snapshot: is commented out in cnf/build.bnd)"
          echo "release=false" >> "${GITHUB_OUTPUT}"
        fi
    - name: Import GPG signing key
      if: ${{ fromJSON(env.canonical) }}
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.java_version }}
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE
    # bnd only adds its -maven-release sign clause when GPG_PASSPHRASE is set, and it signs
    # release builds only. Without this check a missing secret would surface as the Central
    # Portal rejecting the bundle with "Missing signature for file: ..." — fail fast instead.
    - name: Verify a signing key is available
      if: ${{ fromJSON(env.canonical) && (steps.buildtype.outputs.release == 'true') }}
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [[ -z "${GPG_PASSPHRASE}" ]]; then
          echo "::error::GPG_PASSPHRASE is empty, so this release build would be unsigned and the Central Portal would reject it."
          exit 1
        fi
        gpg --list-secret-keys --keyid-format=long
    - name: Publish
      id: publish
      if: ${{ fromJSON(env.canonical) }}
      uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        arguments: :publish
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
    # USER_MANAGED: the deployment is validated but stays unpublished until a deliberate
    # publish via central-deploy-control.yml, so nothing reaches Maven Central from a CI
    # run alone. The deployment id is printed by the script and kept with the artifacts.
    - name: Upload release bundle to Central Portal
      if: ${{ fromJSON(env.canonical) && (steps.buildtype.outputs.release == 'true') }}
      env:
        CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
      run: |
        SONATYPE_BEARER=$(printf '%s:%s' "${CENTRAL_SONATYPE_TOKEN_USERNAME}" "${CENTRAL_SONATYPE_TOKEN_PASSWORD}" | base64 -w0)
        echo "::add-mask::${SONATYPE_BEARER}"
        export SONATYPE_BEARER
        ./.github/scripts/sonatype-upload.sh --publishing-type USER_MANAGED cnf/generated/publish
    - name: Upload Generated Repo
      if: ${{ fromJSON(env.canonical) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: OSGi-Generated-Repo
        path: |
          cnf/generated/repo/
          cnf/generated/publish/
          cnf/generated/publish_DEPLOYMENTID.txt

  spec:
    name: Specification
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.java_version }}
    - name: Build
      id: build
      uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        arguments: --continue :osgi.specs:specifications
    - name: Upload Specification HTML
      if: ${{ fromJSON(env.canonical) || ((github.repository != 'osgi/osgi') && (github.event_name != 'pull_request')) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: OSGi-Specification-HTML
        path: osgi.specs/generated/html/
    - name: Upload Specification PDF
      if: ${{ fromJSON(env.canonical) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: OSGi-Specification-PDF
        path: osgi.specs/generated/*.pdf

  gh_pages:
    if: ${{ (((github.repository == 'osgi/osgi') && (github.ref == 'refs/heads/main')) || (github.repository != 'osgi/osgi')) && (github.event_name != 'pull_request') }}
    needs: spec
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Specification HTML
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: OSGi-Specification-HTML
        path: osgi.specs/generated/html
    - name: Publish Specification HTML
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: osgi.specs/generated/html
        force_orphan: true

  tck:
    permissions:
      contents: none
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.tck-matrix) }}
    name: TCK ${{ matrix.tck }}
    runs-on: ubuntu-latest
    steps:
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.java_version }}
    - name: Download TCK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: OSGi-TCK
    - name: Run TCK
      id: tck
      run: |
        cd osgi.tck.${{ matrix.book }}
        java -jar jar/bnd.jar --exceptions runtests --title ${{ matrix.tck }} --reportdir reports/${{ matrix.tck }} ${{ matrix.tck }}.bnd
    - name: Upload TCK Test Reports
      if: ${{ always() && ((steps.tck.outcome == 'success') || (steps.tck.outcome == 'failure')) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: TCK-${{ matrix.tck }}-reports
        path: |
          osgi.tck.${{ matrix.book }}/reports/
