# Manual control over a staged Sonatype Central Portal deployment.
#
# The CI build uploads release bundles as USER_MANAGED, so a deployment ends up
# VALIDATED and waits. This workflow drives the deliberate decision afterwards:
#
#   status  – ask Central what state the deployment is in (read-only)
#   drop    – delete a VALIDATED/FAILED deployment; nothing was ever published
#   publish – VALIDATED -> PUBLISHING -> Maven Central. Irreversible.
#
# The deployment id is printed by sonatype-upload.sh in the CI build log and is
# also kept as cnf/generated/publish_DEPLOYMENTID.txt in the build artifacts.

name: Central Deploy Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do with the deployment'
        required: true
        type: choice
        options:
        - status
        - drop
        - publish
      deployment_id:
        description: 'Sonatype deployment id (UUID)'
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # status and drop are both reversible in the sense that they cannot make anything
  # public, so they need no environment gate.
  control:
    if: ${{ (inputs.action == 'status') || (inputs.action == 'drop') }}
    name: ${{ inputs.action }} ${{ inputs.deployment_id }}
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    # The scripts only consume SONATYPE_BEARER, they never derive it, so this has to be
    # the first step of every action or they abort with "SONATYPE_BEARER not set".
    # Inputs are passed through the environment, never interpolated into the shell script
    # itself, so a crafted value cannot break out of the quoting.
    - name: ${{ inputs.action }} deployment
      env:
        CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
        DEPLOY_ACTION: ${{ inputs.action }}
        DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      run: |
        case "${DEPLOY_ACTION}" in
          status|drop) ;;
          *) echo "Unsupported action: ${DEPLOY_ACTION}" >&2; exit 1 ;;
        esac
        SONATYPE_BEARER=$(printf '%s:%s' "${CENTRAL_SONATYPE_TOKEN_USERNAME}" "${CENTRAL_SONATYPE_TOKEN_PASSWORD}" | base64 -w0)
        echo "::add-mask::${SONATYPE_BEARER}"
        export SONATYPE_BEARER
        ./.github/scripts/sonatype-deployment.sh "--${DEPLOY_ACTION}" --id "${DEPLOYMENT_ID}"

  # publish is the one irreversible action: once a deployment goes PUBLISHING it lands on
  # Maven Central and cannot be recalled. It therefore runs in its own environment, whose
  # required reviewers are the human checkpoint for a release.
  #
  # NOTE: the 'central-publish' environment must be declared with required reviewers in
  # the org config (osgi/.eclipsefdn, otterdog osgi.jsonnet). Until it is, GitHub creates
  # it on first use *without* protection rules and this gate is nominal only.
  publish:
    if: ${{ inputs.action == 'publish' }}
    name: publish ${{ inputs.deployment_id }}
    runs-on: ubuntu-latest
    environment: central-publish
    steps:
    - name: Git Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Publish deployment to Maven Central
      env:
        CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
        CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
        DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      run: |
        SONATYPE_BEARER=$(printf '%s:%s' "${CENTRAL_SONATYPE_TOKEN_USERNAME}" "${CENTRAL_SONATYPE_TOKEN_PASSWORD}" | base64 -w0)
        echo "::add-mask::${SONATYPE_BEARER}"
        export SONATYPE_BEARER
        ./.github/scripts/sonatype-deployment.sh --publish --id "${DEPLOYMENT_ID}"
